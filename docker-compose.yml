version: '3.8'

services:
  backend:
    build: .
    container_name: nexmeet-backend
    restart: always
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      # Supabase Configuration
      - SUPABASE_URL=https://wcrkufjrqpqxicswfdmp.supabase.co
      - SUPABASE_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Indjcmt1ZmpycXBxeGljc3dmZG1wIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjM3MzE2NjMsImV4cCI6MjA3OTMwNzY2M30.escxedCBUTSI-ZGXmW3mkokPL_rVQh8KAgUs02p6PRg
      # LiveKit Configuration (Self-Hosted Server)
      - LIVEKIT_URL=wss://meet.dhruvmusic.co.in
      - LIVEKIT_API_KEY=APIjsbANgUQUUJx
      - LIVEKIT_API_SECRET=fk8vvbypeAWz3o7nFydTPpfW6WpQXZYEifeksxHWz3xG
      # Node Environment
      - NODE_ENV=production
      # Recording Configuration
      - RECORDINGS_PATH=/app/recordings
      - RECORDINGS_RETENTION_DAYS=15
    volumes:
      # Shared bind mount with LiveKit egress container
      - /opt/recordings:/app/recordings
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:4000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - nexmeet-network

networks:
  nexmeet-network:
    driver: bridge
